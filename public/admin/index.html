<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banner 后台管理</title>
  <style>
    :root {
      --bg: oklch(97% 0.004 286);
      --surface: oklch(100% 0 0);
      --text: oklch(22% 0.015 286);
      --text-2: oklch(48% 0.02 286);
      --line: oklch(90% 0.008 286);
      --accent: oklch(58% 0.19 262);
      --accent-soft: oklch(94% 0.03 262);
      --danger: oklch(58% 0.2 27);
      --ok: oklch(62% 0.15 155);
      --warn: oklch(70% 0.15 80);
      --radius: 10px;
      --shadow: 0 1px 3px rgb(20 20 43 / 0.08), 0 6px 24px rgb(20 20 43 / 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--accent); text-decoration: none; }

    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .topbar h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
    .topbar .spacer { flex: 1; }
    .topbar a.site-link { font-size: 13px; color: var(--text-2); }
    .topbar a.site-link:hover { color: var(--accent); }

    main { max-width: 1080px; margin: 24px auto 80px; padding: 0 24px; }

    .btn {
      appearance: none; border: 1px solid var(--line);
      background: var(--surface); color: var(--text);
      font: inherit; font-size: 13px; font-weight: 500;
      padding: 7px 14px; border-radius: 8px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn--primary:hover { background: oklch(52% 0.19 262); color: #fff; }
    .btn--danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn--sm { padding: 4px 10px; font-size: 12px; }

    /* ---- 上传区 ---- */
    .uploader {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }
    .dropzone {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 32px 16px;
      border: 1.5px dashed var(--line);
      border-radius: 8px;
      color: var(--text-2);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone:hover, .dropzone.is-drag { border-color: var(--accent); background: var(--accent-soft); }
    .dropzone strong { font-size: 15px; color: var(--text); }
    .dropzone small { font-size: 12px; }
    .upload-form {
      display: none; margin-top: 16px; gap: 12px;
      grid-template-columns: 1fr 1fr; align-items: end;
    }
    .upload-form.is-open { display: grid; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--text-2); font-weight: 500; }
    .field input[type="text"] {
      font: inherit; padding: 7px 10px;
      border: 1px solid var(--line); border-radius: 7px;
      background: var(--surface); color: var(--text);
    }
    .field input[type="text"]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .upload-preview {
      grid-column: 1 / -1; display: flex; gap: 12px; align-items: center;
      font-size: 13px; color: var(--text-2);
    }
    .upload-actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
    progress { width: 220px; height: 6px; accent-color: var(--accent); }

    /* ---- 来源切换(本地上传 / 视频链接) ---- */
    .src-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
    .src-tab {
      appearance: none; border: none; background: none; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 600;
      padding: 6px 12px 8px; color: var(--text-2);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .src-tab:hover { color: var(--text); }
    .src-tab.is-active { color: var(--accent); border-bottom-color: var(--accent); }
    .url-form { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; align-items: end; }
    .url-form .field--url { grid-column: 1 / -1; }

    /* ---- Banner 列表(横屏 / 竖屏 Tab) ---- */
    .list-tabs {
      display: flex; align-items: center; gap: 4px;
      margin: 0 0 14px;
      border-bottom: 1px solid var(--line);
    }
    .list-tab {
      appearance: none; border: none; background: none; cursor: pointer;
      font: inherit; font-size: 14px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px 10px; color: var(--text-2);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .list-tab:hover { color: var(--text); }
    .list-tab.is-active { color: var(--accent); border-bottom-color: var(--accent); }
    .list-tab .count {
      font-size: 11px; font-weight: 600; padding: 1px 7px;
      border-radius: 999px; color: var(--accent); background: var(--accent-soft);
    }
    .list-tabs .hint {
      margin-left: auto; margin-bottom: 6px;
      font-size: 12px; color: var(--text-2);
    }
    .cards { display: flex; flex-direction: column; gap: 12px; }
    /* display:flex 会压过 UA 的 [hidden]{display:none},必须显式声明隐藏 */
    .cards[hidden] { display: none; }

    /* 处理中/失败的占位条:比正式卡片更轻量,只保留状态、标题和删除 */
    .cards.pending { gap: 8px; margin-bottom: 14px; }
    .card--pending {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    }
    .card--pending .spin {
      flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%;
      background: var(--warn);
      animation: pending-pulse 1.2s ease-in-out infinite;
    }
    .card--pending.is-failed .spin { background: var(--danger); animation: none; }
    .card--pending .p-title {
      font-size: 13px; font-weight: 600; min-width: 0; max-width: 220px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card--pending .p-hint { flex: 1; min-width: 0; font-size: 12px; color: var(--text-2); }
    .card--pending.is-failed .p-hint { color: var(--danger); }
    @keyframes pending-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .card {
      display: grid; grid-template-columns: 168px 1fr; gap: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .card.is-disabled { opacity: 0.55; }
    .card.is-dragging { opacity: 0.4; }
    .card.drag-over { border-color: var(--accent); }

    .card-media {
      position: relative; width: 168px; height: 96px;
      border-radius: 7px; overflow: hidden;
      background: oklch(20% 0.012 290);
      cursor: grab; flex-shrink: 0;
    }
    /* 竖屏分组的封面位改成 9:16 竖版,避免竖屏视频被横向裁切显示 */
    #cards-portrait .card { grid-template-columns: 96px 1fr; }
    #cards-portrait .card-media { width: 96px; height: 168px; }
    .card-media img, .card-media video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .card-media .drag-hint {
      position: absolute; left: 6px; top: 6px;
      font-size: 10px; line-height: 1; color: #fff;
      background: rgb(0 0 0 / 0.45); padding: 4px 6px; border-radius: 4px;
      pointer-events: none;
    }
    .card-media .dur {
      position: absolute; right: 6px; bottom: 6px;
      font-size: 10px; line-height: 1; color: #fff;
      background: rgb(0 0 0 / 0.5); padding: 4px 6px; border-radius: 4px;
      pointer-events: none;
    }
    .card-media .sz {
      position: absolute; left: 6px; bottom: 6px;
      font-size: 10px; line-height: 1; color: #fff;
      background: rgb(0 0 0 / 0.5); padding: 4px 6px; border-radius: 4px;
      pointer-events: none;
    }

    .card-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .card-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .card-row input[type="text"] {
      font: inherit; font-size: 13px; padding: 5px 9px;
      border: 1px solid var(--line); border-radius: 6px; min-width: 0;
    }
    .card-row input.title-in { width: 200px; font-weight: 600; }
    .card-row input.tag-in { width: 90px; }
    .card-row input.link-in { flex: 1; min-width: 160px; font-size: 12px; color: var(--text-2); }
    .status {
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
    }
    .status--ready { color: var(--ok); background: oklch(95% 0.04 155); }
    .status--processing { color: var(--warn); background: oklch(95% 0.05 80); }
    .status--failed { color: var(--danger); background: oklch(95% 0.05 27); }
    .status--pending { color: var(--warn); background: oklch(95% 0.05 80); }
    .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; }
    .err-msg { font-size: 12px; color: var(--danger); }

    /* ---- 封面选择器 ---- */
    .frame-picker { display: none; flex-direction: column; gap: 8px; }
    .frame-picker.is-open { display: flex; }
    .frames { display: flex; gap: 8px; flex-wrap: wrap; }
    .frames .frame {
      position: relative; width: 128px; border: 2px solid transparent;
      border-radius: 7px; overflow: hidden; cursor: pointer; padding: 0;
      background: none;
    }
    .frames .frame img { width: 100%; display: block; }
    .frames .frame.is-sel { border-color: var(--accent); }
    .frames .frame .t {
      position: absolute; left: 0; right: 0; bottom: 0;
      font-size: 10px; color: #fff; background: rgb(0 0 0 / 0.45);
      padding: 2px 4px; text-align: center;
    }
    .time-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-2); }
    .time-row input[type="range"] { width: 260px; accent-color: var(--accent); }

    /* ---- 转码试验台 ---- */
    .lab {
      margin-top: 32px; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px;
    }
    .lab h2 { font-size: 15px; margin: 0 0 4px; }
    .lab p.sub { font-size: 12px; color: var(--text-2); margin: 0 0 14px; }
    .lab-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .lab-row select {
      font: inherit; padding: 6px 10px;
      border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
    }
    .lab-result { margin-top: 14px; display: none; }
    .lab-result.is-open { display: block; }
    .lab-result video { width: 320px; max-width: 100%; border-radius: 8px; background: #000; }
    .lab-result .meta { font-size: 12px; color: var(--text-2); margin-top: 6px; }

    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: oklch(25% 0.02 286); color: #fff;
      font-size: 13px; padding: 9px 18px; border-radius: 999px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 99;
    }
    .toast.is-show { opacity: 1; }
    .empty { text-align: center; color: var(--text-2); padding: 40px 0; font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Banner 后台管理</h1>
    <span class="spacer"></span>
    <a class="site-link" href="/" target="_blank">查看前台 ↗</a>
  </header>

  <main>
    <!-- 上传 -->
    <section class="uploader" aria-label="添加视频">
      <div class="src-tabs" role="tablist" aria-label="视频来源">
        <button type="button" class="src-tab is-active" id="tab-file" role="tab" aria-selected="true">本地上传</button>
        <button type="button" class="src-tab" id="tab-url" role="tab" aria-selected="false">视频链接</button>
      </div>

      <div class="src-pane" id="pane-file" role="tabpanel">
        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择或拖入视频文件">
          <strong>点击选择或拖入视频</strong>
          <small>支持 MP4 / MOV / WebM 等,≤ 100MB;上传后自动转码为 Banner 规格(640×360 · 无音轨 · faststart)</small>
          <input type="file" id="file-input" accept="video/*,.mkv,.avi" hidden />
        </div>
        <form class="upload-form" id="upload-form">
          <div class="field">
            <label for="up-title">标题</label>
            <input type="text" id="up-title" maxlength="80" placeholder="Banner 标题" />
          </div>
          <div class="field">
            <label for="up-tag">角标</label>
            <input type="text" id="up-tag" maxlength="20" placeholder="如:动画 / 推荐" />
          </div>
          <div class="upload-preview" id="upload-preview"></div>
          <div class="upload-actions">
            <button type="submit" class="btn btn--primary" id="up-submit">开始上传</button>
            <button type="button" class="btn" id="up-cancel">取消</button>
            <progress id="up-progress" value="0" max="100" hidden></progress>
            <span id="up-status" aria-live="polite"></span>
          </div>
        </form>
      </div>

      <div class="src-pane" id="pane-url" role="tabpanel" hidden>
        <form class="url-form" id="url-form">
          <div class="field field--url">
            <label for="url-input">视频地址</label>
            <input type="text" id="url-input" placeholder="https://example.com/video.mp4(服务器会下载后转码,≤ 100MB)" />
          </div>
          <div class="field">
            <label for="url-title">标题</label>
            <input type="text" id="url-title" maxlength="80" placeholder="留空则取文件名" />
          </div>
          <div class="field">
            <label for="url-tag">角标</label>
            <input type="text" id="url-tag" maxlength="20" placeholder="如:动画 / 推荐" />
          </div>
          <div class="upload-actions">
            <button type="submit" class="btn btn--primary" id="url-submit">添加</button>
            <span id="url-status" aria-live="polite"></span>
          </div>
        </form>
      </div>
    </section>

    <!-- 列表:横屏 / 竖屏两个 Tab,各自独立排序与启停,前台按分组分别取用 -->
    <div class="list-tabs" role="tablist" aria-label="Banner 分组">
      <button type="button" class="list-tab is-active" id="tab-landscape" role="tab" aria-selected="true" aria-controls="cards-landscape">
        横屏 <span class="count" id="count-landscape">0</span>
      </button>
      <button type="button" class="list-tab" id="tab-portrait" role="tab" aria-selected="false" aria-controls="cards-portrait">
        竖屏 <span class="count" id="count-portrait">0</span>
      </button>
      <span class="hint">上传后按视频宽高比自动归类 · 拖动左侧封面在组内排序</span>
    </div>

    <!-- 处理中/处理失败且方向未知的条目:置顶占位,探测归组后自动进入下方对应 Tab -->
    <section class="cards pending" id="cards-pending" aria-label="处理中的视频" hidden></section>

    <section class="cards" id="cards-landscape" role="tabpanel" aria-labelledby="tab-landscape"></section>
    <section class="cards" id="cards-portrait" role="tabpanel" aria-labelledby="tab-portrait" hidden></section>

    <!-- 转码试验台 -->
    <section class="lab" aria-label="转码试验台">
      <h2>转码试验台</h2>
      <p class="sub">本地挑个视频试不同规格,不写入 Banner 列表,只返回转码结果供预览。</p>
      <div class="lab-row">
        <input type="file" id="lab-file" accept="video/*,.mkv,.avi" />
        <select id="lab-preset">
          <option value="360p">360p · CRF28(接近 Banner 档)</option>
          <option value="720p" selected>720p · CRF26</option>
          <option value="1080p">1080p · CRF24</option>
        </select>
        <button class="btn" id="lab-run" disabled>开始转码</button>
        <span id="lab-status" aria-live="polite"></span>
      </div>
      <div class="lab-result" id="lab-result">
        <video id="lab-video" controls muted playsinline></video>
        <div class="meta" id="lab-meta"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
  (function () {
    'use strict';

    /* ---------------- 小工具 ---------------- */
    var $ = function (sel) { return document.querySelector(sel); };
    var toastTimer = null;
    function toast(msg) {
      var el = $('#toast');
      el.textContent = msg;
      el.classList.add('is-show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('is-show'); }, 2200);
    }
    function api(method, url, body) {
      return fetch(url, {
        method: method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store'
      }).then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
          return data;
        });
      });
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmtSize(n) {
      if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
      return Math.max(1, Math.round(n / 1024)) + ' KB';
    }

    /* ---------------- 上传 ---------------- */
    var pendingFile = null;
    var dropzone = $('#dropzone');
    var fileInput = $('#file-input');
    var uploadForm = $('#upload-form');

    function pickFile(file) {
      if (!file) return;
      pendingFile = file;
      $('#up-title').value = file.name.replace(/\.[^.]+$/, '');
      $('#upload-preview').textContent = file.name + ' · ' + fmtSize(file.size);
      $('#up-status').textContent = '';
      uploadForm.classList.add('is-open');
    }

    dropzone.addEventListener('click', function () { fileInput.click(); });
    dropzone.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    fileInput.addEventListener('change', function () { pickFile(fileInput.files[0]); });
    ['dragover', 'dragenter'].forEach(function (ev) {
      dropzone.addEventListener(ev, function (e) {
        e.preventDefault();
        dropzone.classList.add('is-drag');
      });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      dropzone.addEventListener(ev, function (e) {
        e.preventDefault();
        dropzone.classList.remove('is-drag');
      });
    });
    dropzone.addEventListener('drop', function (e) {
      pickFile(e.dataTransfer.files && e.dataTransfer.files[0]);
    });

    $('#up-cancel').addEventListener('click', function () {
      pendingFile = null;
      fileInput.value = '';
      uploadForm.classList.remove('is-open');
    });

    uploadForm.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!pendingFile) return;
      var fd = new FormData();
      fd.append('video', pendingFile);
      fd.append('title', $('#up-title').value.trim());
      fd.append('tag', $('#up-tag').value.trim());

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/banners');
      var prog = $('#up-progress');
      prog.hidden = false;
      $('#up-submit').disabled = true;
      xhr.upload.onprogress = function (ev) {
        if (ev.lengthComputable) prog.value = Math.round(ev.loaded / ev.total * 100);
      };
      xhr.onload = function () {
        prog.hidden = true;
        $('#up-submit').disabled = false;
        try {
          var data = JSON.parse(xhr.responseText);
          if (xhr.status >= 400) throw new Error(data.error || '上传失败');
          toast('已上传,后台处理中…');
          trackPending(data.banner);
          pendingFile = null;
          fileInput.value = '';
          uploadForm.classList.remove('is-open');
          refresh();
        } catch (err) {
          $('#up-status').textContent = err.message;
        }
      };
      xhr.onerror = function () {
        prog.hidden = true;
        $('#up-submit').disabled = false;
        $('#up-status').textContent = '网络错误';
      };
      xhr.send(fd);
    });

    /* ---------------- 来源切换 & 视频链接添加 ---------------- */
    var tabFile = $('#tab-file');
    var tabUrl = $('#tab-url');
    // 注意:与横竖屏 Tab 的 switchTab 同名会互相覆盖,这里必须用独立命名
    function switchSrcTab(which) {
      var isFile = which === 'file';
      tabFile.classList.toggle('is-active', isFile);
      tabUrl.classList.toggle('is-active', !isFile);
      tabFile.setAttribute('aria-selected', isFile ? 'true' : 'false');
      tabUrl.setAttribute('aria-selected', isFile ? 'false' : 'true');
      $('#pane-file').hidden = !isFile;
      $('#pane-url').hidden = isFile;
    }
    tabFile.addEventListener('click', function () { switchSrcTab('file'); });
    tabUrl.addEventListener('click', function () { switchSrcTab('url'); });

    $('#url-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var url = $('#url-input').value.trim();
      if (!url) { $('#url-status').textContent = '请填写视频地址'; return; }
      $('#url-submit').disabled = true;
      $('#url-status').textContent = '提交中…';
      api('POST', '/api/banners-from-url', {
        url: url,
        title: $('#url-title').value.trim(),
        tag: $('#url-tag').value.trim()
      }).then(function (data) {
        toast('已添加,服务器下载并处理中…');
        trackPending(data.banner);
        $('#url-input').value = '';
        $('#url-title').value = '';
        $('#url-tag').value = '';
        $('#url-status').textContent = '';
        refresh();
      }).catch(function (err) {
        $('#url-status').textContent = err.message;
      }).finally(function () {
        $('#url-submit').disabled = false;
      });
    });

    /* ---------------- Banner 列表(横屏 / 竖屏 Tab) ---------------- */
    // 当前 Tab:landscape | portrait;渲染与排序都只作用于对应容器
    var TABS = {
      landscape: { tabEl: $('#tab-landscape'), el: $('#cards-landscape'), countEl: $('#count-landscape') },
      portrait:  { tabEl: $('#tab-portrait'),  el: $('#cards-portrait'),  countEl: $('#count-portrait') }
    };
    var currentTab = 'landscape';
    var polling = null;
    var lastBanners = []; // 最近一次渲染的列表,事件代理里按 id 取数据用

    /** 切换 Tab:只显示对应容器,更新 aria 状态 */
    function switchTab(which) {
      if (!TABS[which]) return;
      currentTab = which;
      Object.keys(TABS).forEach(function (k) {
        var on = k === which;
        TABS[k].tabEl.classList.toggle('is-active', on);
        TABS[k].tabEl.setAttribute('aria-selected', on ? 'true' : 'false');
        TABS[k].el.hidden = !on;
      });
    }
    TABS.landscape.tabEl.addEventListener('click', function () { switchTab('landscape'); });
    TABS.portrait.tabEl.addEventListener('click', function () { switchTab('portrait'); });

    function statusChip(b) {
      if (b.status === 'processing') return '<span class="status status--processing">处理中…</span>';
      if (b.status === 'failed') return '<span class="status status--failed">失败</span>';
      if ((b.posterStatus || 'pending') === 'pending') return '<span class="status status--pending">待选封面</span>';
      return '<span class="status status--ready">已上线</span>';
    }

    /** 方向归类说明文案:手动指定时标注来源 */
    function orientHint(b) {
      if (b.orientation === 'landscape' || b.orientation === 'portrait') return '手动指定';
      if (b.width && b.height) return '按分辨率 ' + b.width + '×' + b.height + ' 自动判定';
      return '待探测';
    }

    function renderList(banners) {
      lastBanners = banners; // 供预览弹窗按 id 查询视频地址与方向
      // 方向未知(刚上传、宽高还没探测出来)的条目先进占位区,
      // 轮询等它归组后自动消失、出现在对应 Tab;失败且未归组的也留在这里展示错误
      var pendingEl = $('#cards-pending');
      var pending = banners.filter(function (b) {
        return b.effOrientation === 'unknown' &&
          (b.status === 'processing' || b.status === 'failed');
      });
      pendingEl.hidden = !pending.length;
      pendingEl.innerHTML = pending.map(function (b) {
        var failed = b.status === 'failed';
        return '' +
          '<article class="card card--pending' + (failed ? ' is-failed' : '') + '" data-id="' + b.id + '">' +
            '<span class="spin" aria-hidden="true"></span>' +
            '<span class="p-title">' + esc(b.title || '新视频') + '</span>' +
            '<span class="p-hint">' + (failed
              ? '处理失败:' + esc(b.error || '未知错误')
              : '处理中…下载/探测完成后自动归入横屏或竖屏') + '</span>' +
            '<button class="btn btn--sm btn--danger act-del">删除</button>' +
          '</article>';
      }).join('');
      if (pending.some(function (b) { return b.status === 'processing'; })) {
        clearTimeout(polling);
        polling = setTimeout(refresh, 2000);
      }
      Object.keys(TABS).forEach(function (key) {
        var g = TABS[key];
        var items = banners.filter(function (b) {
          return b.effOrientation === key;   // 严格匹配,不兜底
        });
        g.countEl.textContent = items.length;
        if (!items.length) {
          g.el.innerHTML = '<div class="empty">还没有' + (key === 'portrait' ? '竖屏' : '横屏') + ' Banner,上传后按视频宽高比自动归类</div>';
          return;
        }
        g.el.innerHTML = items.map(function (b) {
        var media = b.poster
          ? '<img src="' + esc(b.poster) + '" alt="" loading="lazy" />'
          : (b.video
              ? '<video src="' + esc(b.video) + '#t=0.1" muted playsinline preload="metadata"></video>'
              : '');
        return '' +
          '<article class="card' + (b.enabled ? '' : ' is-disabled') + '" data-id="' + b.id + '">' +
            '<div class="card-media" draggable="true" title="拖动排序">' +
              media +
              '<span class="drag-hint">⠿ 拖动排序</span>' +
              // 大小角标:本地文件显示体积,URL 导入的播放源在远端标"远程"
              (b.video
                ? '<span class="sz">' + (b.sizeText || '远程') + '</span>'
                : '') +
              (b.duration ? '<span class="dur">' + b.duration + 's</span>' : '') +
            '</div>' +
            '<div class="card-body">' +
              '<div class="card-row">' +
                '<input type="text" class="title-in" value="' + esc(b.title) + '" maxlength="80" aria-label="标题" />' +
                '<input type="text" class="tag-in" value="' + esc(b.tag) + '" maxlength="20" placeholder="角标" aria-label="角标" />' +
                statusChip(b) +
                '<label class="switch"><input type="checkbox" class="enabled-in"' + (b.enabled ? ' checked' : '') + ' />启用</label>' +
              '</div>' +
              '<div class="card-row">' +
                '<input type="text" class="link-in" value="' + esc(b.link || '') + '" placeholder="点击跳转链接(可空)" aria-label="跳转链接" />' +
              '</div>' +
              '<div class="card-row">' +
                '<label class="switch" style="cursor:default">归类:<select class="orient-in" aria-label="归类方向">' +
                  '<option value="auto"' + (b.orientation !== 'portrait' && b.orientation !== 'landscape' ? ' selected' : '') + '>自动(' + esc(orientHint(b)) + ')</option>' +
                  '<option value="landscape"' + (b.orientation === 'landscape' ? ' selected' : '') + '>横屏</option>' +
                  '<option value="portrait"' + (b.orientation === 'portrait' ? ' selected' : '') + '>竖屏</option>' +
                '</select></label>' +
                '<span class="hint" style="font-size:11px;color:var(--text-2)">改归类会移动到对应分组并影响前台展示位置</span>' +
              '</div>' +
              (b.error ? '<div class="err-msg">' + esc(b.error) + '</div>' : '') +
              '<div class="card-row">' +
                '<button class="btn btn--sm act-save">保存</button>' +
                '<button class="btn btn--sm act-poster"' + (b.status === 'ready' ? '' : ' disabled') + '>封面</button>' +
                '<button type="button" class="btn btn--sm act-preview"' + (b.video ? '' : ' disabled') + '>预览</button>' +
                '<span class="spacer" style="flex:1"></span>' +
                '<button class="btn btn--sm btn--danger act-del">删除</button>' +
              '</div>' +
              '<div class="frame-picker">' +
                '<div class="frames"></div>' +
                '<div class="time-row">' +
                  '<span>自定义时间点</span>' +
                  '<input type="range" class="time-range" min="0" max="' + (b.duration || 10) + '" step="0.1" value="0" />' +
                  '<span class="time-val">0.0s</span>' +
                  '<button class="btn btn--sm act-time-pick">抽这一帧</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</article>';
        }).join('');
      });
    }

    // 事件代理绑定到两个 Tab 容器(共用同一套处理器)
    var clickHandler = function (e) {
      var card = e.target.closest('.card');
      if (!card) return;
      var id = card.dataset.id;

      if (e.target.closest('.act-save')) {
        api('PUT', '/api/banners/' + id, {
          title: card.querySelector('.title-in').value.trim(),
          tag: card.querySelector('.tag-in').value.trim(),
          link: card.querySelector('.link-in').value.trim(),
          enabled: card.querySelector('.enabled-in').checked
        }).then(function () { toast('已保存'); refresh(); })
          .catch(function (err) { toast(err.message); });
      }

      if (e.target.closest('.act-del')) {
        if (!window.confirm('确定删除这条 Banner?视频和封面文件会一并删除。')) return;
        api('DELETE', '/api/banners/' + id)
          .then(function () { toast('已删除'); refresh(); })
          .catch(function (err) { toast(err.message); });
      }

      if (e.target.closest('.act-preview')) {
        var b = lastBanners.find(function (x) { return x.id === id; });
        if (!b || !b.video) return;
        openPreview(b);
      }

      if (e.target.closest('.act-poster')) {
        var picker = card.querySelector('.frame-picker');
        picker.classList.toggle('is-open');
        if (picker.classList.contains('is-open')) loadFrames(card, id);
      }

      if (e.target.closest('.frame')) {
        var frame = e.target.closest('.frame');
        api('POST', '/api/banners/' + id + '/poster', { frame: frame.dataset.file })
          .then(function () { toast('封面已更新'); refresh(); })
          .catch(function (err) { toast(err.message); });
      }

      if (e.target.closest('.act-time-pick')) {
        var t = parseFloat(card.querySelector('.time-range').value);
        api('POST', '/api/banners/' + id + '/poster', { time: t })
          .then(function () { toast('封面已更新'); refresh(); })
          .catch(function (err) { toast(err.message); });
      }
    };

    // 归类切换:立即 PUT orientation,成功后切到目标 Tab 并整表刷新(卡片随方向移动)
    var changeHandler = function (e) {
      if (!e.target.classList.contains('orient-in')) return;
      var val = e.target.value;
      var card = e.target.closest('.card');
      api('PUT', '/api/banners/' + card.dataset.id, { orientation: val })
        .then(function () {
          toast('归类已更新');
          if (val === 'landscape' || val === 'portrait') switchTab(val);
          refresh();
        })
        .catch(function (err) { toast(err.message); });
    };

    var inputHandler = function (e) {
      if (e.target.classList.contains('time-range')) {
        e.target.closest('.time-row').querySelector('.time-val').textContent =
          parseFloat(e.target.value).toFixed(1) + 's';
      }
      if (e.target.classList.contains('enabled-in')) {
        var card = e.target.closest('.card');
        api('PUT', '/api/banners/' + card.dataset.id, { enabled: e.target.checked })
          .then(function () { toast(e.target.checked ? '已启用' : '已停用'); refresh(); })
          .catch(function (err) { toast(err.message); });
      }
    };

    // 绑定到两个 Tab 容器;占位区只需要 click(删除),input/change 的目标元素不存在,复用同一处理器是安全的
    Object.keys(TABS).forEach(function (k) {
      var el = TABS[k].el;
      el.addEventListener('click', clickHandler);
      el.addEventListener('input', inputHandler);
      el.addEventListener('change', changeHandler);
    });
    $('#cards-pending').addEventListener('click', clickHandler);

    /** 预览弹窗:独立小窗播放,按横/竖屏取对应比例的窗口尺寸并居中;
        命名窗口让多次点击复用同一个预览窗,不会越开越多 */
    function openPreview(b) {
      var portrait = b.effOrientation === 'portrait';
      var w = portrait ? 400 : 780;
      var h = portrait ? 800 : 500;
      var left = Math.max(0, Math.round((screen.width - w) / 2));
      var top = Math.max(0, Math.round((screen.height - h) / 2));
      var url = '/video-player.html?src=' + encodeURIComponent(b.video) +
        '&title=' + encodeURIComponent(b.title || '');
      window.open(url, 'banner-preview',
        'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
    }

    function loadFrames(card, id) {
      api('GET', '/api/banners/' + id + '/frames').then(function (data) {
        var box = card.querySelector('.frames');
        box.innerHTML = data.frames.map(function (f) {
          return '<button type="button" class="frame" data-file="' + esc(f.file) + '">' +
            '<img src="' + esc(f.url) + '" alt="候选封面 ' + esc(f.file) + '" loading="lazy" />' +
            '<span class="t">' + f.time + 's</span></button>';
        }).join('') || '<span style="font-size:12px;color:var(--text-2)">候选帧还没生成好,稍等片刻再点开</span>';
      }).catch(function (err) { toast(err.message); });
    }

    /* ---------------- 拖动排序(组内;提交时合并两组顺序) ---------------- */
    var dragEl = null;
    var dragHost = null;   // 拖动发生的分组容器,插入操作只在该组内进行
    var dragStartHandler = function (e) {
      var card = e.target.closest('.card');
      if (!card) return;
      dragEl = card;
      dragHost = e.currentTarget;
      card.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
    };
    var dragEndHandler = function () {
      if (dragEl) dragEl.classList.remove('is-dragging');
      // 合并两个 Tab 的当前顺序一次性提交(后端按数组索引重排 order)
      var ids = Object.keys(TABS).reduce(function (acc, k) {
        return acc.concat(Array.from(TABS[k].el.querySelectorAll('.card')).map(function (c) {
          return c.dataset.id;
        }));
      }, []);
      dragEl = null;
      dragHost = null;
      api('PUT', '/api/banners-order', { ids: ids })
        .then(function () { toast('顺序已保存'); })
        .catch(function (err) { toast(err.message); });
    };
    var dragOverHandler = function (e) {
      e.preventDefault();
      var over = e.target.closest('.card');
      // 只允许插入到同一 Tab 的容器:e.currentTarget === dragHost
      if (!over || !dragEl || over === dragEl || e.currentTarget !== dragHost) return;
      var rect = over.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      dragHost.insertBefore(dragEl, before ? over : over.nextSibling);
    };
    Object.keys(TABS).forEach(function (k) {
      var el = TABS[k].el;
      el.addEventListener('dragstart', dragStartHandler);
      el.addEventListener('dragend', dragEndHandler);
      el.addEventListener('dragover', dragOverHandler);
    });

    /* ---------------- 轮询刷新(有处理中任务时) ---------------- */
    // 记录新上传(处理中)的 banner id:处理完成后自动切到它所属的 Tab
    var pendingIds = [];

    function trackPending(banner) {
      if (banner && banner.id) pendingIds.push(banner.id);
    }

    function refresh() {
      api('GET', '/api/banners').then(function (data) {
        renderList(data.banners);
        // 新上传的处理完成:按其生效方向切到对应 Tab,让用户直接看到归组结果
        pendingIds = pendingIds.filter(function (pid) {
          var b = data.banners.find(function (x) { return x.id === pid; });
          if (!b) return false;                       // 已被删除,不再跟踪
          if (b.status === 'processing') return true; // 还在处理,继续等
          var target = b.effOrientation || 'landscape';
          if (target !== currentTab) switchTab(target);
          toast('「' + (b.title || '新视频') + '」已归入' +
            (target === 'portrait' ? '竖屏' : '横屏') +
            (b.status === 'failed' ? '(处理失败)' : ''));
          return false;
        });
        var busy = data.banners.some(function (b) { return b.status === 'processing'; });
        clearTimeout(polling);
        if (busy || pendingIds.length) polling = setTimeout(refresh, 2000);
      }).catch(function (err) { toast(err.message); });
    }

    /* ---------------- 转码试验台 ---------------- */
    var labFile = $('#lab-file');
    labFile.addEventListener('change', function () {
      $('#lab-run').disabled = !labFile.files.length;
    });
    $('#lab-run').addEventListener('click', function () {
      if (!labFile.files.length) return;
      var fd = new FormData();
      fd.append('video', labFile.files[0]);
      fd.append('preset', $('#lab-preset').value);
      var status = $('#lab-status');
      status.textContent = '转码中…(大文件可能需要几十秒)';
      $('#lab-run').disabled = true;
      var t0 = performance.now();
      fetch('/api/transcode-preview', { method: 'POST', body: fd })
        .then(function (r) {
          if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || '转码失败'); });
          return r.blob();
        })
        .then(function (blob) {
          var secs = ((performance.now() - t0) / 1000).toFixed(1);
          var url = URL.createObjectURL(blob);
          var video = $('#lab-video');
          video.src = url;
          $('#lab-result').classList.add('is-open');
          $('#lab-meta').textContent =
            '输出 ' + fmtSize(blob.size) + ' · 耗时 ' + secs + 's' +
            '(原文件 ' + fmtSize(labFile.files[0].size) + ')';
          status.textContent = '';
        })
        .catch(function (err) { status.textContent = err.message; })
        .finally(function () { $('#lab-run').disabled = false; });
    });

    refresh();
  })();
  </script>
</body>
</html>
