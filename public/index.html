<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1b22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Banner 视频轮播 · 移动端 H5</title>

  <link rel="stylesheet" href="vendor/swiper-bundle.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a class="brand" href="#">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Vidora</span>
      </a>
      <nav class="app-nav" aria-label="主导航">
        <a class="app-nav__item is-active" href="#">首页</a>
        <a class="app-nav__item" href="#">推荐</a>
        <a class="app-nav__item" href="#">分类</a>
      </nav>
    </header>

    <main class="app-main">
      <!-- 横屏区:顶部宽幅自动轮播 -->
      <section class="zone" aria-labelledby="zone-banner-title">
        <header class="zone-head">
          <span class="zone-kicker">横屏 · 16:9</span>
          <h2 class="zone-title" id="zone-banner-title">焦点轮播</h2>
          <span class="zone-hint">自动播放 · 可左右滑动切换</span>
        </header>
        <div class="banner" aria-label="Banner 视频轮播">
          <div class="swiper banner-swiper">
            <div class="swiper-wrapper" id="banner-wrapper"></div>
            <div class="swiper-pagination banner-pagination"></div>
          </div>
          <button
            type="button"
            class="banner-toggle"
            id="banner-toggle"
            aria-label="暂停轮播"
            aria-pressed="false"
          >
            <svg class="banner-toggle__icon banner-toggle__pause" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
              <path d="M7 5v14M17 5v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </svg>
            <svg class="banner-toggle__icon banner-toggle__play" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
              <path d="M8 5v14l11-7z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </section>

      <div class="zone-divider" role="separator" aria-hidden="true"></div>

      <!-- 竖屏区:原生宽高比横滑,视频按原始比例定宽(竖屏变窄不裁切) -->
      <section class="zone" aria-labelledby="zone-strip-title">
        <header class="zone-head">
          <span class="zone-kicker" id="zone-strip-kicker">竖屏 · 9:16</span>
          <h2 class="zone-title" id="zone-strip-title">竖屏精选</h2>
          <span class="zone-hint" id="zone-strip-hint">原始比例 · 左右滑动浏览</span>
        </header>
        <div class="strip" aria-label="竖屏视频横滑区">
          <div class="swiper strip-swiper">
            <div class="swiper-wrapper" id="strip-wrapper"></div>
          </div>
        </div>
      </section>

      <footer class="app-foot">
        <span>Banner 视频轮播 · <a href="/admin/" style="color:inherit">后台管理</a></span>
      </footer>
    </main>
  </div>

  <script src="vendor/swiper-bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
